version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: saas-billing-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=subscription-billing-saas

volumes:
  mongodb_data:
    driver: local
